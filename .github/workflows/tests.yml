name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  smoke:
    name: recording pipeline (PHP ${{ matrix.php }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '7.0', '7.2', '7.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
      # No dependencies needed: the harness stubs the framework helpers.
      - run: php tests/smoke.php

  views:
    name: blade views compile
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          extensions: mbstring, json
          coverage: none
      # No --ignore-platform-reqs on purpose: it lets Composer resolve
      # dependencies against a newer PHP than the one running, which pulls in
      # a symfony/polyfill-mbstring built for PHP 7.2 and fatals on autoload.
      - run: composer install --no-interaction --prefer-dist
      - run: php tests/views.php
